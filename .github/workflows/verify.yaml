name: Verify Videoluk

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python checks
        run: |
          python -m py_compile server.py
          python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check dist/app.js

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate production compose and Caddy
        run: |
          password_hash="$(docker run --rm caddy:2-alpine caddy hash-password --plaintext test-password)"
          cp .env.example .env
          VIDEOLUK_BASIC_AUTH_HASH="$password_hash" docker compose -f deploy/compose.production.yaml config >/dev/null
          docker run --rm \
            -e VIDEOLUK_DOMAIN=localhost \
            -e VIDEOLUK_BASIC_AUTH_USER=videoluk \
            -e VIDEOLUK_BASIC_AUTH_HASH="$password_hash" \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: videoluk:test
      - name: End-to-end acceptance test
        run: docker run --rm --entrypoint python videoluk:test scripts/acceptance_test.py
